name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.5.0)"
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        env:
          TAG: ${{ inputs.tag }}
        run: |
          MAJOR="${TAG%%.*}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/eigenhelm"

          # Serve (default) tags
          echo "serve_tags=${IMAGE}:latest,${IMAGE}:${TAG},${IMAGE}:${MAJOR}" >> "$GITHUB_OUTPUT"

          # CLI tags
          echo "cli_tags=${IMAGE}:cli,${IMAGE}:${TAG}-cli,${IMAGE}:${MAJOR}-cli" >> "$GITHUB_OUTPUT"

      - name: Build and push serve image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.serve_tags }}
          cache-from: type=gha,scope=serve
          cache-to: type=gha,mode=max,scope=serve

      - name: Build and push CLI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cli
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.cli_tags }}
          cache-from: type=gha,scope=cli
          cache-to: type=gha,mode=max,scope=cli
