name: "eigenhelm"
description: "Evaluate code quality against aesthetic metrics trained on elite corpora"
author: "metacogdev"

branding:
  icon: "award"
  color: "purple"

inputs:
  paths:
    description: "Files or directories to evaluate (space-separated)"
    required: false
    default: "."
  model:
    description: "Path to .npz eigenspace model file (uses bundled polyglot model if omitted)"
    required: false
  diff:
    description: "Git revision range for changed-files-only mode. 'auto' detects PR base branch. Set to '' to evaluate all files."
    required: false
    default: "auto"
  format:
    description: "Output format: human, json, or sarif"
    required: false
    default: "human"
  classify:
    description: "Show accept/marginal/reject decision labels"
    required: false
    default: "true"
  strict:
    description: "Treat marginal as reject (exit code 2 for warn or reject)"
    required: false
    default: "false"
  lenient:
    description: "Treat marginal as accept (exit code 0 for accept or warn)"
    required: false
    default: "false"
  version:
    description: "eigenhelm version to install (e.g. 0.9.0). Omit for latest."
    required: false
  exclude:
    description: "Glob patterns to exclude from evaluation (newline or comma-separated). Example: tests/**,docs/**,*.md"
    required: false
  sarif-upload:
    description: "Upload SARIF results to GitHub Code Scanning"
    required: false
    default: "false"
  fail-on:
    description: "When to fail the workflow step: 'reject' (default), 'warn', or 'never'"
    required: false
    default: "reject"

outputs:
  exit-code:
    description: "Raw exit code from eigenhelm (0=accept, 1=warn, 2=reject, 3=error)"
    value: ${{ steps.evaluate.outputs.exit-code }}
  score:
    description: "Mean aesthetic score across evaluated files (0.0-1.0, lower is better)"
    value: ${{ steps.evaluate.outputs.score }}
  decision:
    description: "Overall decision: accept, warn, or reject"
    value: ${{ steps.evaluate.outputs.decision }}
  files-evaluated:
    description: "Number of files evaluated"
    value: ${{ steps.evaluate.outputs.files-evaluated }}
  sarif-file:
    description: "Path to SARIF output file (when sarif-upload=true or format=sarif)"
    value: ${{ steps.evaluate.outputs.sarif-file }}

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Install eigenhelm
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "${INPUT_VERSION}" ]; then
          uv tool install "eigenhelm==${INPUT_VERSION}"
        else
          uv tool install "${GITHUB_ACTION_PATH}"
        fi

    - name: Write exclude patterns
      if: inputs.exclude != ''
      shell: bash
      env:
        INPUT_EXCLUDE: ${{ inputs.exclude }}
      run: |
        rm -f .eigenhelmignore
        echo "${INPUT_EXCLUDE}" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' > .eigenhelmignore

    - name: Resolve diff range
      id: resolve-diff
      shell: bash
      env:
        INPUT_DIFF: ${{ inputs.diff }}
      run: |
        DIFF_INPUT="${INPUT_DIFF}"
        if [ "${DIFF_INPUT}" = "auto" ]; then
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "pull_request_target" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            if [ -n "${BASE_SHA}" ]; then
              git fetch --no-tags --depth=1 origin "${BASE_SHA}" >/dev/null 2>&1 || true
              echo "range=${BASE_SHA}...HEAD" >> "$GITHUB_OUTPUT"
            else
              echo "range=origin/${{ github.base_ref }}...HEAD" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "range=" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "range=${DIFF_INPUT}" >> "$GITHUB_OUTPUT"
        fi

    - name: Run evaluation
      id: evaluate
      shell: bash
      env:
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_CLASSIFY: ${{ inputs.classify }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_LENIENT: ${{ inputs.lenient }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_SARIF_UPLOAD: ${{ inputs.sarif-upload }}
      run: |
        # Build CLI arguments
        EH_ARGS=()

        if [ -n "${INPUT_MODEL}" ]; then
          EH_ARGS+=(--model "${INPUT_MODEL}")
        fi

        DIFF_RANGE="${{ steps.resolve-diff.outputs.range }}"
        if [ -n "${DIFF_RANGE}" ]; then
          EH_ARGS+=(--diff "${DIFF_RANGE}")
        fi

        if [ "${INPUT_CLASSIFY}" = "true" ]; then
          EH_ARGS+=(--classify)
        fi

        if [ "${INPUT_STRICT}" = "true" ]; then
          EH_ARGS+=(--strict)
        fi

        if [ "${INPUT_LENIENT}" = "true" ]; then
          EH_ARGS+=(--lenient)
        fi

        read -r -a PATH_ARGS <<< "${INPUT_PATHS}"
        if [ "${#PATH_ARGS[@]}" -eq 0 ]; then
          PATH_ARGS=(".")
        fi

        # --- Pass 1: JSON for structured outputs ---
        set +e
        JSON_OUTPUT=$(eh evaluate "${EH_ARGS[@]}" --format json "${PATH_ARGS[@]}" 2>/tmp/eh-stderr.log)
        EH_EXIT=$?
        set -e

        echo "exit-code=${EH_EXIT}" >> "$GITHUB_OUTPUT"

        # Parse structured fields from JSON summary
        if [ -n "${JSON_OUTPUT}" ]; then
          SCORE=$(echo "${JSON_OUTPUT}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('summary',{}).get('mean_score',''))" 2>/dev/null || true)
          FILES=$(echo "${JSON_OUTPUT}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('summary',{}).get('total_files',''))" 2>/dev/null || true)
          DECISION=$(echo "${JSON_OUTPUT}" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('summary',{}).get('overall_decision',''))" 2>/dev/null || true)
          echo "score=${SCORE}" >> "$GITHUB_OUTPUT"
          echo "files-evaluated=${FILES}" >> "$GITHUB_OUTPUT"
          echo "decision=${DECISION}" >> "$GITHUB_OUTPUT"
        fi

        # --- Pass 2: User-requested output format ---
        FORMAT="${INPUT_FORMAT}"
        if [ "${FORMAT}" = "json" ]; then
          echo "${JSON_OUTPUT}"
        elif [ "${FORMAT}" = "sarif" ]; then
          SARIF_FILE="${RUNNER_TEMP}/eigenhelm-results.sarif"
          SARIF_ERR="${RUNNER_TEMP}/eigenhelm-sarif.err"
          # Pass 2 re-renders Pass 1's decision in the requested format. Same
          # EH_ARGS/PATH_ARGS, only --format differs, so the exit code matches
          # EH_EXIT: warn(1)/reject(2) is an ordinary quality decision, not a
          # generation failure. The fail-on policy block below decides whether
          # to fail the step. Only a crash (3) or empty output is a real
          # rendering failure. (#66)
          set +e
          eh evaluate "${EH_ARGS[@]}" --format sarif "${PATH_ARGS[@]}" > "${SARIF_FILE}" 2>"${SARIF_ERR}"
          GEN_EXIT=$?
          set -e
          if [ "${GEN_EXIT}" -eq 3 ]; then
            echo "::error::eigenhelm failed to generate SARIF"
            cat "${SARIF_ERR}"
            exit 3
          fi
          if [ -s "${SARIF_FILE}" ]; then
            cat "${SARIF_FILE}"
            echo "sarif-file=${SARIF_FILE}" >> "$GITHUB_OUTPUT"
          elif [ "${GEN_EXIT}" -eq 0 ]; then
            # Clean exit, no output: no evaluable files in the selected range
            # (paths/exclude filtered everything, or only unrecognized extensions
            # changed -- e.g. release-please PRs touching only CHANGELOG.md /
            # pyproject.toml). Nothing to gate; leave sarif-file unset.
            echo "::notice::eigenhelm: no evaluable files in the selected range"
          else
            # warn(1)/reject(2) with no rendered SARIF is anomalous (eh always
            # emits a report when it has files) -- treat as a generation failure.
            echo "::error::eigenhelm failed to generate SARIF"
            cat "${SARIF_ERR}"
            exit 3
          fi
        else
          HUMAN_ERR="${RUNNER_TEMP}/eigenhelm-human.err"
          HUMAN_OUT="${RUNNER_TEMP}/eigenhelm-human.out"
          # See sarif branch: warn(1)/reject(2) is not a generation failure. (#66)
          set +e
          eh evaluate "${EH_ARGS[@]}" --format human "${PATH_ARGS[@]}" > "${HUMAN_OUT}" 2>"${HUMAN_ERR}"
          GEN_EXIT=$?
          set -e
          if [ "${GEN_EXIT}" -eq 3 ]; then
            echo "::error::eigenhelm failed to generate human output"
            cat "${HUMAN_ERR}"
            exit 3
          fi
          if [ -s "${HUMAN_OUT}" ]; then
            cat "${HUMAN_OUT}"
          elif [ "${GEN_EXIT}" -eq 0 ]; then
            # Clean exit, no output: no evaluable files in the selected range
            # (paths/exclude filtered everything, or only unrecognized extensions
            # changed -- e.g. release-please PRs touching only CHANGELOG.md /
            # pyproject.toml). Nothing to gate; let the fail-on policy decide
            # on EH_EXIT (0 here), so the step succeeds.
            echo "::notice::eigenhelm: no evaluable files in the selected range"
          else
            # warn(1)/reject(2) with no rendered report is anomalous (eh always
            # emits a report when it has files) -- treat as a generation failure.
            echo "::error::eigenhelm failed to generate human output"
            cat "${HUMAN_ERR}"
            exit 3
          fi
        fi

        # --- Pass 3 (conditional): SARIF for Code Scanning upload ---
        if [ "${INPUT_SARIF_UPLOAD}" = "true" ] && [ "${FORMAT}" != "sarif" ]; then
          SARIF_FILE="${RUNNER_TEMP}/eigenhelm-results.sarif"
          SARIF_ERR="${RUNNER_TEMP}/eigenhelm-sarif.err"
          # Same rationale as Pass 2: warn(1)/reject(2) still renders a valid
          # SARIF file, so populate sarif-file and let the upload step run on
          # the PRs the gate exists to catch. Only a crash (3) or empty output
          # skips the upload -- non-fatal (::warning::), never exits. (#66)
          set +e
          eh evaluate "${EH_ARGS[@]}" --format sarif "${PATH_ARGS[@]}" > "${SARIF_FILE}" 2>"${SARIF_ERR}"
          GEN_EXIT=$?
          set -e
          if [ "${GEN_EXIT}" -ne 3 ] && [ -s "${SARIF_FILE}" ]; then
            echo "sarif-file=${SARIF_FILE}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Skipping SARIF upload because eigenhelm failed to generate SARIF"
            cat "${SARIF_ERR}"
          fi
        fi

        # Always propagate runtime errors — exit 3 is a crash, not a quality decision
        if [ "${EH_EXIT}" -eq 3 ]; then
          echo "::error::eigenhelm: runtime error — check logs"
          cat /tmp/eh-stderr.log
          exit 3
        fi

        # --- Apply fail-on policy ---
        FAIL_ON="${INPUT_FAIL_ON}"
        if [ "${FAIL_ON}" = "never" ]; then
          exit 0
        elif [ "${FAIL_ON}" = "warn" ] && [ "${EH_EXIT}" -ge 1 ]; then
          echo "::error::eigenhelm: code quality issues detected (${DECISION}, score ${SCORE})"
          exit "${EH_EXIT}"
        elif [ "${FAIL_ON}" = "reject" ] && [ "${EH_EXIT}" -ge 2 ]; then
          echo "::error::eigenhelm: code rejected (score ${SCORE})"
          exit "${EH_EXIT}"
        fi

    - name: Upload SARIF to GitHub Code Scanning
      if: inputs.sarif-upload == 'true' && steps.evaluate.outputs.sarif-file != ''
      # SARIF upload is best-effort telemetry, not a quality decision. A
      # consumer repo may have `sarif-upload: true` without GitHub Code
      # Scanning enabled (e.g. private repos, Enterprise without Advanced
      # Security); the upload-sarif action then errors with "Code scanning
      # is not enabled". That must not fail the whole job -- the
      # accept/warn/reject decision above is what gates. (#66)
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.evaluate.outputs.sarif-file }}
